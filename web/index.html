<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>opencsv</title>
    <link rel="stylesheet" href="./src/styles.css?v=m2-cell-panel" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Workspace">
        <div class="brand">opencsv</div>
        <div id="fileList" class="file-list">
          <div class="empty-file-list">
            <span class="file-name">No file open</span>
            <span class="file-meta">Ready</span>
          </div>
        </div>
      </aside>

      <section class="workspace">
        <header class="toolbar">
          <div class="segmented" aria-label="View mode">
            <button id="gridTabButton" class="active" type="button">Grid</button>
            <button id="sqlTabButton" type="button" data-command="view.sql">SQL</button>
            <button id="profileTabButton" type="button" data-command="view.profile">Profile</button>
            <button id="paletteButton" type="button" data-command="command.palette">Cmd</button>
          </div>
          <form class="file-open" id="openForm">
            <input id="pathInput" type="text" placeholder="/tmp/opencsv-sample.csv" aria-label="CSV path" />
            <input id="fileInput" type="file" accept=".csv,.tsv,text/csv,text/tab-separated-values,text/plain" hidden aria-hidden="true" tabindex="-1" />
            <button id="openButton" type="button" data-command="file.open">Open</button>
          </form>
          <div class="tool-actions">
            <input id="commandInput" type="text" placeholder="Find/filter..." aria-label="Find or filter text" />
            <input id="replaceInput" type="text" placeholder="Replace..." aria-label="Replace text" />
            <div class="find-options" aria-label="Find options">
              <button id="findCaseButton" type="button" title="Match case" aria-pressed="false">Aa</button>
              <button id="findWholeButton" type="button" title="Match whole cell" aria-pressed="false">=</button>
              <button id="findRegexButton" type="button" title="Use regular expression" aria-pressed="false">.*</button>
            </div>
            <button id="filterButton" type="button" title="Filter" data-command="view.filter">Filter</button>
            <button id="sortButton" type="button" title="Sort selected column" data-command="view.sort">Sort</button>
            <button id="findButton" type="button" title="Find" data-command="edit.find">Find</button>
            <button id="findPrevButton" type="button" title="Previous match">↑</button>
            <span id="findMatchCount" class="find-match-count" aria-live="polite">0/0</span>
            <button id="findNextButton" type="button" title="Next match">↓</button>
            <button id="replaceButton" type="button" title="Replace first match" data-command="edit.replace">Replace</button>
            <button id="replaceAllButton" type="button" title="Replace all matches" data-command="edit.replaceAll">All</button>
            <button id="diffButton" type="button" title="Compare files" data-command="diff.open">Compare</button>
            <button id="readOnlyButton" type="button" title="Toggle read-only mode" data-command="file.toggleReadOnly">Read Only</button>
            <button id="saveButton" type="button" title="Save" data-command="file.save">Save</button>
          </div>
        </header>

        <section class="grid-frame" aria-label="CSV grid prototype">
          <canvas id="grid" width="1200" height="760"></canvas>
          <canvas id="frozenGrid" width="1200" height="36" aria-hidden="true"></canvas>
          <textarea id="editor" spellcheck="false" aria-label="Cell editor"></textarea>
          <section id="sqlPanel" class="sql-panel" hidden aria-label="SQL console">
            <div class="sql-editor-row">
              <textarea id="sqlInput" spellcheck="false" aria-label="SQL query">SELECT * FROM current LIMIT 25</textarea>
              <button id="runSqlButton" type="button">Run</button>
            </div>
            <div id="sqlResult" class="sql-result" aria-live="polite"></div>
          </section>
          <section id="diffPanel" class="diff-panel" hidden aria-label="CSV diff">
            <div class="diff-editor-row">
              <input id="leftDiffPath" type="text" placeholder="/tmp/old.csv" aria-label="Left CSV path" />
              <input id="rightDiffPath" type="text" placeholder="/tmp/new.csv" aria-label="Right CSV path" />
              <button id="runDiffButton" type="button">Run</button>
            </div>
            <div class="diff-options" aria-label="Compare options">
              <label><input id="diffIgnoreCase" type="checkbox" /> Ignore case</label>
              <label><input id="diffIgnoreWhitespace" type="checkbox" /> Ignore whitespace</label>
              <label><input id="diffMatchHeaders" type="checkbox" /> Match headers</label>
              <input id="diffIgnoredColumns" type="text" placeholder="Ignore columns e.g. 3,5" aria-label="Ignored diff columns" />
              <button id="diffPrevButton" type="button" title="Previous difference">↑</button>
              <button id="diffNextButton" type="button" title="Next difference">↓</button>
            </div>
            <div id="diffSummary" class="diff-summary" aria-live="polite"></div>
            <div id="diffResult" class="diff-result"></div>
          </section>
          <section id="profilePanel" class="profile-panel" hidden aria-label="Data profile">
            <div id="profileSummary" class="profile-summary" aria-live="polite"></div>
            <div id="profileColumns" class="profile-columns"></div>
            <div id="profileIssues" class="profile-issues"></div>
          </section>
        </section>

        <footer class="statusbar">
          <span id="status">Ready</span>
          <span id="encodingStatus">Encoding</span>
          <span id="delimiterStatus">Delimiter</span>
          <span id="quoteStatus">Quote minimal</span>
          <span id="headerStatus">Header</span>
          <span id="readOnlyStatus">Editable</span>
          <span id="externalStatus">Synced</span>
        </footer>
      </section>

      <aside class="inspector" aria-label="Column inspector">
        <h2>Cell</h2>
        <div class="cell-panel">
          <textarea id="cellValueInput" spellcheck="false" aria-label="Cell value"></textarea>
          <div class="cell-actions">
            <button id="applyCellValueButton" type="button">Apply</button>
            <a id="openCellLink" role="button" target="_blank" rel="noopener noreferrer" aria-disabled="true">Open Link</a>
          </div>
        </div>
        <h2>Column</h2>
        <div class="metric">
          <span>Name</span>
          <strong id="columnName">id</strong>
        </div>
        <div class="metric">
          <span>Type</span>
          <strong id="columnType">unknown</strong>
        </div>
        <div class="metric">
          <span>Nulls</span>
          <strong id="columnNulls">unknown</strong>
        </div>
        <div class="metric">
          <span>Distinct</span>
          <strong id="columnDistinct">unknown</strong>
        </div>
        <div class="metric">
          <span>Cell Quote</span>
          <strong id="cellQuote">unknown</strong>
        </div>
        <div class="metric">
          <span>Format</span>
          <strong id="formatSummary">unknown</strong>
        </div>
      </aside>
    </main>

    <div id="commandPalette" class="command-palette-backdrop" hidden>
      <section class="command-palette" role="dialog" aria-modal="true" aria-label="Command palette">
        <input id="paletteInput" type="text" autocomplete="off" spellcheck="false" aria-label="Command" />
        <div id="paletteList" class="palette-list" role="listbox" aria-label="Commands"></div>
      </section>
    </div>

    <section id="columnMenu" class="column-menu" role="menu" aria-label="Column menu" hidden>
      <strong id="columnMenuTitle">Column</strong>
      <button id="columnSortAsc" type="button" role="menuitem">Sort ascending</button>
      <button id="columnSortDesc" type="button" role="menuitem">Sort descending</button>
      <button id="columnAddSortAsc" type="button" role="menuitem">Then sort ascending</button>
      <button id="columnAddSortDesc" type="button" role="menuitem">Then sort descending</button>
      <button id="columnFilterValue" type="button" role="menuitem">Filter by selected value</button>
      <button id="columnFilterBlank" type="button" role="menuitem">Show blanks</button>
      <button id="columnFilterFilled" type="button" role="menuitem">Show non-blanks</button>
      <div id="columnMenuValues" class="column-menu-values" aria-label="Column values"></div>
      <button id="columnApplyValues" type="button" role="menuitem" disabled>Apply selected values</button>
      <button id="columnClearView" type="button" role="menuitem">Clear filter/sort</button>
    </section>

    <script type="module" src="./src/app.js?v=m2-diff-navigation"></script>
  </body>
</html>
